[project]
name = "mango-disease-prediction"
version = "0.1.0"
description = "Mango Disease Detection & Yield Prediction Platform"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "albumentations>=2.0.8",
    "beautifulsoup4>=4.14.3",
    "earthengine-api>=1.7.26",
    "fastapi[standard]>=0.115.0",
    "google-genai>=2.7.0",
    "litellm>=1.86.2",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0.80",
    "pandas>=2.2.0",
    "pillow>=10.2.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.20",
    "requests>=2.34.1",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "torch>=2.2.0",
    "torchcam>=0.3.1",
    "torchvision>=0.17.0",
    "uvicorn>=0.30.0",
    "xgboost>=2.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

