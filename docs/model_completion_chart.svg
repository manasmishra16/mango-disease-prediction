      .ksit-sub { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 8.5px; fill: #64748b; }
      .slide-num { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; fill: #64748b; }
      .root-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 15px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .header-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 13px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .task-text { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11.5px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .model-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11.5px; fill: #1e3a8a; text-anchor: middle; dominant-baseline: middle; }
      .metric-text { font-family: 'Inter', monospace, sans-serif; font-weight: 700; font-size: 11.5px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .footer-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 10px; fill: #64748b; }
      
      .pill { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 12; }
      .pill-header { fill: #ffffff; stroke: #1e293b; stroke-width: 1.8; rx: 14; }
      .pill-root { fill: #ffffff; stroke: #1e293b; stroke-width: 2.0; rx: 18; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.08)); }
      .conn-line { stroke: #334155; stroke-width: 1.3; }
    </style>
    
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
